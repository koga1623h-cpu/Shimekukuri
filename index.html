<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- data helpers ---------- */
const STORE = 'shimekukuri:entries:v1';

const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = (k) => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); };

const WD = ['日', '月', '火', '水', '木', '金', '土'];
const fmtLong = (k) => { const d = parseKey(k); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${WD[d.getDay()]})`; };
const fmtShort = (k) => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()} ${WD[d.getDay()]}`; };

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch { return {}; }
}
function saveEntries(obj) {
  try { localStorage.setItem(STORE, JSON.stringify(obj)); } catch {}
}

const MOODS = [
  { v: 1, label: 'しんどい', color: '#E5786E' },
  { v: 2, label: 'いまひとつ', color: '#E9A05C' },
  { v: 3, label: 'ふつう', color: '#E7C55A' },
  { v: 4, label: 'よい', color: '#7FBE7A' },
  { v: 5, label: '最高', color: '#4FA88E' },
];
const moodOf = (v) => MOODS.find((m) => m.v === v);

const isEmpty = (e) => !e || (!e.mood && !(e.good || '').trim() && !(e.improve || '').trim() && !(e.tomorrow || '').trim());

/* ---------- small building blocks ---------- */

function MoodPicker({ value, onChange }) {
  return (
    <div>
      <div className="flex items-end justify-between gap-2">
        {MOODS.map((m) => {
          const active = value === m.v;
          return (
            <button
              key={m.v}
              onClick={() => onChange(active ? 0 : m.v)}
              className="flex flex-col items-center gap-2 flex-1 group focus:outline-none"
              aria-pressed={active}
              aria-label={m.label}
            >
              <span
                className="rounded-full transition-all duration-300 ease-out"
                style={{
                  width: active ? 44 : 26,
                  height: active ? 44 : 26,
                  background: active ? m.color : '#EDEFEA',
                  boxShadow: active ? `0 6px 16px ${m.color}55` : 'none',
                  border: active ? 'none' : '1px solid #E1E4DE',
                }}
              />
              <span
                className="text-[11px] transition-colors duration-200"
                style={{ color: active ? m.color : '#B4B9BE', fontWeight: active ? 700 : 400 }}
              >
                {m.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Field({ label, color, placeholder, value, onChange }) {
  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <span className="w-2 h-2 rounded-full" style={{ background: color }} />
        <label className="text-[13px] font-medium text-ink">{label}</label>
      </div>
      <textarea
        rows={3}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        className="w-full rounded-2xl bg-white border border-line px-4 py-3 text-[15px] leading-relaxed text-ink placeholder:text-muted/70 focus:outline-none focus:border-ink/30 focus:ring-2 focus:ring-ink/5 transition"
        style={{ minHeight: 84 }}
      />
    </div>
  );
}

/* ---------- editor (today / a chosen date) ---------- */

function Editor({ dateKey, entries, setEntries, onGoToday }) {
  const existing = entries[dateKey] || {};
  const [mood, setMood] = useState(existing.mood || 0);
  const [good, setGood] = useState(existing.good || '');
  const [improve, setImprove] = useState(existing.improve || '');
  const [tomorrow, setTomorrow] = useState(existing.tomorrow || '');
  const [saved, setSaved] = useState(false);

  // reload fields when switching date
  useEffect(() => {
    const e = entries[dateKey] || {};
    setMood(e.mood || 0); setGood(e.good || ''); setImprove(e.improve || ''); setTomorrow(e.tomorrow || '');
    setSaved(false);
  }, [dateKey]);

  const isToday = dateKey === todayKey();

  const handleSave = () => {
    const next = { ...entries };
    const payload = { mood, good: good.trim(), improve: improve.trim(), tomorrow: tomorrow.trim(), updatedAt: Date.now() };
    if (isEmpty(payload)) { delete next[dateKey]; } else { next[dateKey] = payload; }
    setEntries(next); saveEntries(next);
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  return (
    <div className="rise">
      <div className="flex items-baseline justify-between mb-5">
        <div>
          <div className="text-[13px] text-muted">{isToday ? 'きょうの振り返り' : '過去の記録'}</div>
          <div className="text-[20px] font-bold tracking-tight">{fmtLong(dateKey)}</div>
        </div>
        {!isToday && (
          <button onClick={onGoToday} className="text-[13px] text-next font-medium shrink-0">今日へ →</button>
        )}
      </div>

      <div className="bg-white rounded-3xl border border-line p-5 mb-4">
        <div className="text-[13px] font-medium mb-3">今日の気分</div>
        <MoodPicker value={mood} onChange={setMood} />
      </div>

      <div className="space-y-4">
        <Field label="よかったこと" color="#2E9E6B" value={good} onChange={setGood}
          placeholder="うまくいったこと、進んだこと、感謝したいこと" />
        <Field label="改善したいこと" color="#D2922E" value={improve} onChange={setImprove}
          placeholder="つまずいた点、次はこうしたい、と思ったこと" />
        <Field label="明日やること" color="#3E77C2" value={tomorrow} onChange={setTomorrow}
          placeholder="いちばん大事な1つ、忘れたくないこと" />
      </div>

      <button
        onClick={handleSave}
        className="w-full mt-6 rounded-2xl py-3.5 text-[15px] font-bold text-white transition-all active:scale-[.99]"
        style={{ background: saved ? '#2E9E6B' : '#2B3038' }}
      >
        {saved ? '保存しました' : '保存する'}
      </button>
      <div className="h-2" />
    </div>
  );
}

/* ---------- history list ---------- */

function History({ entries, onOpen }) {
  const keys = Object.keys(entries).filter((k) => !isEmpty(entries[k])).sort().reverse();
  if (keys.length === 0) {
    return (
      <div className="rise pt-24 text-center px-8">
        <div className="text-[15px] text-muted">まだ記録がありません。</div>
        <div className="text-[13px] text-muted/70 mt-1">今日のできごとから、ひとつ書いてみましょう。</div>
      </div>
    );
  }
  return (
    <div className="rise space-y-3">
      <div className="text-[13px] text-muted mb-1">{keys.length}件の記録</div>
      {keys.map((k) => {
        const e = entries[k];
        const m = moodOf(e.mood);
        const preview = (e.good || e.tomorrow || e.improve || '').replace(/\n/g, ' ');
        return (
          <button key={k} onClick={() => onOpen(k)}
            className="w-full text-left bg-white rounded-2xl border border-line p-4 flex items-center gap-3 active:bg-paper transition">
            <span className="w-9 h-9 rounded-full shrink-0 flex items-center justify-center"
              style={{ background: m ? m.color + '22' : '#EDEFEA' }}>
              <span className="w-3.5 h-3.5 rounded-full" style={{ background: m ? m.color : '#C9CDC7' }} />
            </span>
            <span className="min-w-0 flex-1">
              <span className="block text-[14px] font-medium">{fmtShort(k)}</span>
              <span className="block text-[13px] text-muted truncate">{preview || '（記録あり）'}</span>
            </span>
            <span className="text-muted/50 text-lg shrink-0">›</span>
          </button>
        );
      })}
      <div className="h-2" />
    </div>
  );
}

/* ---------- mood chart (self-drawn SVG) ---------- */

function Chart({ entries }) {
  const [days, setDays] = useState(14);
  const data = useMemo(() => {
    const out = [];
    const now = new Date(); now.setHours(0, 0, 0, 0);
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const k = keyOf(d);
      const e = entries[k];
      out.push({ k, d, mood: e && e.mood ? e.mood : null });
    }
    return out;
  }, [entries, days]);

  const recorded = data.filter((p) => p.mood);
  const W = 320, H = 170, padX = 16, padY = 18;
  const innerW = W - padX * 2, innerH = H - padY * 2;
  const x = (i) => padX + (data.length <= 1 ? innerW / 2 : (innerW * i) / (data.length - 1));
  const y = (v) => padY + innerH - ((v - 1) / 4) * innerH;

  // build path over recorded points only, connecting across gaps
  const pts = data.map((p, i) => ({ i, mood: p.mood })).filter((p) => p.mood);
  const line = pts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${x(p.i).toFixed(1)} ${y(p.mood).toFixed(1)}`).join(' ');
  const area = pts.length
    ? `M ${x(pts[0].i).toFixed(1)} ${(padY + innerH).toFixed(1)} ` +
      pts.map((p) => `L ${x(p.i).toFixed(1)} ${y(p.mood).toFixed(1)}`).join(' ') +
      ` L ${x(pts[pts.length - 1].i).toFixed(1)} ${(padY + innerH).toFixed(1)} Z`
    : '';

  const avg = recorded.length ? recorded.reduce((s, p) => s + p.mood, 0) / recorded.length : 0;

  return (
    <div className="rise">
      <div className="flex items-center justify-between mb-4">
        <div>
          <div className="text-[13px] text-muted">気分の推移</div>
          <div className="text-[20px] font-bold">
            {recorded.length ? <>平均 {avg.toFixed(1)} <span className="text-[13px] font-normal text-muted">/ 5</span></> : '記録待ち'}
          </div>
        </div>
        <div className="flex bg-white border border-line rounded-full p-0.5 text-[13px]">
          {[14, 30].map((n) => (
            <button key={n} onClick={() => setDays(n)}
              className="px-3 py-1 rounded-full font-medium transition"
              style={{ background: days === n ? '#2B3038' : 'transparent', color: days === n ? '#fff' : '#8A9099' }}>
              {n}日
            </button>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-3xl border border-line p-4">
        {recorded.length === 0 ? (
          <div className="h-[170px] flex items-center justify-center text-[13px] text-muted">
            記録が増えるとここに折れ線が出ます。
          </div>
        ) : (
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 'auto' }}>
            <defs>
              <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4FA88E" stopOpacity="0.22" />
                <stop offset="100%" stopColor="#4FA88E" stopOpacity="0.02" />
              </linearGradient>
            </defs>
            {[1, 2, 3, 4, 5].map((v) => (
              <line key={v} x1={padX} x2={W - padX} y1={y(v)} y2={y(v)} stroke="#EEF0EC" strokeWidth="1" />
            ))}
            {area && <path d={area} fill="url(#fill)" />}
            {line && <path d={line} fill="none" stroke="#3E9E86" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />}
            {pts.map((p) => (
              <circle key={p.i} cx={x(p.i)} cy={y(p.mood)} r="3.5" fill="#fff" stroke={moodOf(p.mood).color} strokeWidth="2.5" />
            ))}
          </svg>
        )}
      </div>

      <div className="flex justify-between text-[11px] text-muted mt-2 px-1">
        <span>{recorded.length ? fmtShort(data[0].k) : ''}</span>
        <span>{recorded.length ? '今日' : ''}</span>
      </div>
      <div className="h-2" />
    </div>
  );
}

/* ---------- summary (weekly / monthly) ---------- */

function Summary({ entries, onOpen }) {
  const [range, setRange] = useState('week');
  const now = new Date(); now.setHours(23, 59, 59, 999);
  const start = new Date(); start.setHours(0, 0, 0, 0);
  if (range === 'week') start.setDate(start.getDate() - 6);
  else start.setDate(start.getDate() - 29);

  const inRange = Object.keys(entries)
    .filter((k) => !isEmpty(entries[k]))
    .filter((k) => { const d = parseKey(k); return d >= start && d <= now; })
    .sort().reverse();

  const moods = inRange.map((k) => entries[k].mood).filter(Boolean);
  const avg = moods.length ? moods.reduce((a, b) => a + b, 0) / moods.length : 0;
  const best = inRange.filter((k) => (entries[k].mood || 0) >= 4);
  const goods = inRange.filter((k) => (entries[k].good || '').trim());
  const spanDays = range === 'week' ? 7 : 30;

  const dist = MOODS.map((m) => ({ ...m, n: moods.filter((v) => v === m.v).length }));
  const maxN = Math.max(1, ...dist.map((d) => d.n));

  return (
    <div className="rise">
      <div className="flex bg-white border border-line rounded-full p-0.5 text-[13px] mb-5 w-fit">
        {[['week', '今週'], ['month', '今月']].map(([v, l]) => (
          <button key={v} onClick={() => setRange(v)}
            className="px-4 py-1.5 rounded-full font-medium transition"
            style={{ background: range === v ? '#2B3038' : 'transparent', color: range === v ? '#fff' : '#8A9099' }}>
            {l}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <div className="bg-white rounded-3xl border border-line p-4">
          <div className="text-[12px] text-muted">記録した日</div>
          <div className="text-[26px] font-bold leading-tight">{inRange.length}<span className="text-[14px] font-normal text-muted"> / {spanDays}日</span></div>
        </div>
        <div className="bg-white rounded-3xl border border-line p-4">
          <div className="text-[12px] text-muted">平均の気分</div>
          <div className="text-[26px] font-bold leading-tight" style={{ color: avg ? moodOf(Math.round(avg)).color : '#8A9099' }}>
            {avg ? avg.toFixed(1) : '—'}<span className="text-[14px] font-normal text-muted"> / 5</span>
          </div>
        </div>
      </div>

      {moods.length > 0 && (
        <div className="bg-white rounded-3xl border border-line p-4 mb-4">
          <div className="text-[13px] font-medium mb-3">気分の内訳</div>
          <div className="space-y-2">
            {dist.map((d) => (
              <div key={d.v} className="flex items-center gap-3">
                <span className="text-[12px] text-muted w-16 shrink-0">{d.label}</span>
                <span className="flex-1 h-2.5 rounded-full bg-paper overflow-hidden">
                  <span className="block h-full rounded-full transition-all" style={{ width: `${(d.n / maxN) * 100}%`, background: d.color }} />
                </span>
                <span className="text-[12px] text-muted w-5 text-right">{d.n}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {inRange.length === 0 ? (
        <div className="text-center text-[13px] text-muted pt-6">この期間の記録はまだありません。</div>
      ) : (
        <div className="bg-white rounded-3xl border border-line p-4">
          <div className="text-[13px] font-medium mb-3 flex items-center gap-2">
            <span className="w-2 h-2 rounded-full" style={{ background: '#2E9E6B' }} />
            よかったことの振り返り
          </div>
          {goods.length === 0 ? (
            <div className="text-[13px] text-muted">この期間はまだ書かれていません。</div>
          ) : (
            <div className="space-y-3">
              {goods.map((k) => (
                <button key={k} onClick={() => onOpen(k)} className="w-full text-left flex gap-3 active:opacity-70">
                  <span className="text-[12px] text-muted shrink-0 w-10 pt-0.5">{fmtShort(k).split(' ')[0]}</span>
                  <span className="text-[14px] leading-relaxed whitespace-pre-wrap">{entries[k].good}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}
      <div className="h-2" />
    </div>
  );
}

    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/90 backdrop-blur border-t border-line"

}

/* ---------- app ---------- */

function App() {
  const [entries, setEntries] = useState(loadEntries);
  const [view, setView] = useState('today');
  const [editKey, setEditKey] = useState(todayKey());

  const openDate = (k) => { setEditKey(k); setView('today'); window.scrollTo(0, 0); };
  const goToday = () => { setEditKey(todayKey()); window.scrollTo(0, 0); };

  const switchView = (v) => { if (v === 'today') setEditKey(todayKey()); setView(v); window.scrollTo(0, 0); };

  return (
    <div className="min-h-screen max-w-md mx-auto px-5 pt-8" style={{ paddingBottom: 92 }}>
      <header className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-2">
          <span className="w-6 h-6 rounded-lg flex items-center justify-center" style={{ background: '#2B3038' }}>
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#7FBE7A' }} />
          </span>
          <span className="text-[15px] font-bold tracking-tight">しめくくり</span>
        </div>
        <span className="text-[12px] text-muted">一日の、静かな振り返り</span>
      </header>

      {view === 'today' && <Editor dateKey={editKey} entries={entries} setEntries={setEntries} onGoToday={goToday} />}
      {view === 'log' && <History entries={entries} onOpen={openDate} />}
      {view === 'chart' && <Chart entries={entries} />}
      {view === 'summary' && <Summary entries={entries} onOpen={openDate} />}

      <Nav view={view} setView={switchView} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
